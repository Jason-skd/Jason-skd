# Jason-skd 动态主页配置 —— 用户唯一日常编辑点（契约 issue #1）
# README.md 由流水线生成，绝不手写；改这里 + 等 Actions 跑（或手动 dispatch）。

timezone: Asia/Shanghai

theme:
  # 靛夜青（Tokyo Night 调性），定稿色值（已回填 issue #1）
  base: "1a1b26"
  accent: "7aa2f7"
  cyan: "7dcfff"

# ── sources 层取数配置 ──
author_emails: # 只统计这些邮箱的提交
  - "wintor76111@gmail.com"

org:
  login: "SCNUAutoPtr"
  repos:
    - "SCNUAutoPtr/go-ce-v3"

window_days: 365
include_external: true # 语言统计纳入外部贡献仓库（如 awesome-dsh-plugin 上游）

# 竖排连续布局：按此顺序自上而下拼接
sections:
  - banner
  - typing
  - stats
  - languages
  - org_card
  - recent_project

# 各节标题（v1.2 英文文案）——想改标题改这里；stats.header 的数字需与 window_days 保持一致
stats:
  header: "📊 Last 365 Days"

typing:
  lines:
    - "wintor_ · CS @ SCNU/Aberdeen"
    - "Zig & Go Minimalism enthusiasts"
    - "AutoBits @ SCNUAutoPtr member"
    - "ENTJ · Commander"
  font: "Fira Code"
  size: 28
  width: 750
  background: "0D1117" # GitHub 深色卡背（v1.1 定稿）

banner:
  height: 280
  # v1.1 预览对比待用户选定后启用（capsule-render 内嵌文字，白字自动适配渐变）：
  # text: "wintor_"
  # desc: "CS @ Aberdeen · 造轮子爱好者"
  # font_size: 42
  # desc_size: 20

languages:
  header: "🧑‍💻 Languages"
  icon_height: 48 # v1.1：纯图标行放大
  # linguist 类型白名单（issue #8）：仅这些类型的语言计入统计，其余自动出局
  # （data: YAML/JSON/TOML/SQL…；prose: Markdown…）。想去掉 CSS 这类 markup 就删掉 markup。
  types:
    - programming
    - markup

org_card:
  enabled: true
  header: "🏫 Organization"
  logo_height: 96 # v1.1：纯 logo 放大带链接

recent_project:
  enabled: true
  header: "🚀 Recently Working On"
  icon_height: 96 # v1.2：大语言图标为视觉主体，链接挂图标上
  exclude_external: true

excludes:
  repos: []
  # 语言手动微调专用（优先级最高）；Markdown/JSON/SQL/YAML 等辅助格式已由
  # languages.types 白名单自动排除，无需在此列举（issue #8）
  languages: []
  # 显式列表会整体覆盖代码默认值，故默认 vendor 类目录必须一并列全
  paths:
    - "**/vendor/**"
    - "**/vendors/**"
    - "**/third_party/**"
    - "**/thirdparty/**"
    - "**/third-party/**"
    - "**/extern/**"
    - "**/external/**"
    - "**/deps/**"
    - "**/zig-pkg/**" # Iridoporth-backend：用户手写过 vendored sqlite（zig-pkg），commit 加权无法归零，需路径排除
